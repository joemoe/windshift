<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windshift – live wind, eastern Lake Constance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1620; --panel:#112230; --panel2:#16303f; --line:#21414f;
    --ink:#e8f1f5; --mute:#8aa6b3; --water:#123a52;
    --b0:#7fb3c8; --b1:#4fc3a1; --b2:#c9d85a; --b3:#f2a93b; --b4:#ef5b4c;
    --side:400px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:13px}
  body{overflow:hidden}
  .app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top)}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  header .sub{color:var(--mute);font-size:12px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--mute);padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
  .seg button.on{background:var(--panel2);color:var(--ink);font-weight:600}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
  .btn.on{border-color:var(--b1)}
  select.btn{appearance:auto;max-width:100%}
  main{display:grid;grid-template-columns:1fr var(--side);min-height:0}
  .mapwrap{position:relative;min-height:0}
  #map{position:absolute;inset:0;background:var(--water)}
  aside{overflow-y:auto;border-left:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  @media (orientation:portrait), (max-width:820px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh}
    main{grid-template-columns:1fr}
    .mapwrap{height:58vh;height:58svh}
    aside{border-left:0;overflow:visible}
    header .sub{flex-basis:100%;order:9}
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 6px;font-weight:600;display:flex;align-items:center;gap:8px}
  h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
  /* summary */
  .summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .summary .k{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
  .summary .v{font-size:14px;font-weight:600}
  .warn{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;color:#08131a;margin-left:auto}
  /* stations */
  .st{display:grid;grid-template-columns:28px 1fr 84px 62px;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--line)}
  .st:first-of-type{border-top:0}
  .st .nm b{font-size:13px;display:block}
  .st .nm span{font-size:10px;color:var(--mute)}
  .st .val{text-align:right;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.1}
  .st .val small{display:block;font-size:10px;color:var(--mute);font-family:Inter,sans-serif}
  .st svg.spark{width:84px;height:26px}
  .st.stale{opacity:.5}
  .err{color:var(--b4);font-size:11px}
  .mini{width:28px;height:28px}
  /* model */
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .note{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.4}
  .note b{color:var(--ink)} .note .ok{color:var(--b1)}
  .sys{display:grid;grid-template-columns:10px 1fr 18px;gap:1px 6px;align-items:center;padding:3px 0;border-top:1px solid var(--line)}
  .sys:first-of-type{border-top:0}
  .sys .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .sys .nm{font-size:12px;display:flex;gap:6px;align-items:baseline;min-width:0}
  .sys .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sys .nm span{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);white-space:nowrap}
  .sys .i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font:600 11px Inter,sans-serif;cursor:pointer;padding:0}
  .sys input[type=range]{grid-column:2 / 4;width:100%;margin:0;accent-color:var(--c);height:16px}
  .sys .ends{grid-column:2 / 4;display:none;justify-content:space-between;font-size:9px;color:var(--mute);margin-top:-2px}
  .sys .dirrow{grid-column:2 / 4;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mute)}
  .sys .dirrow input{flex:1}
  .sys .dirrow b{font-family:'JetBrains Mono',monospace;color:var(--ink);font-weight:500;min-width:58px;text-align:right}
  .sys .hint{grid-column:2 / 4;display:none;font-size:10px;color:var(--b2);line-height:1.35}
  .sys .why{grid-column:2 / 4;font-size:11px;color:var(--mute);line-height:1.4;display:none;background:var(--panel2);border-radius:6px;padding:6px 8px;margin-top:2px}
  .sys.open .why{display:block}
  .sys.open .ends{display:flex} .sys.open .hint{display:block}
  .sys.off{opacity:.6}
  details.about{font-size:11px;color:var(--mute);line-height:1.5}
  details.about summary{cursor:pointer}
  details.about a{color:var(--b0)}
  /* map overlays */
  .leaflet-container{font-family:Inter,sans-serif}
  .leaflet-control-attribution{background:rgba(11,22,32,.75)!important;color:var(--mute)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--b0)!important}
  .wm{display:flex;flex-direction:column;align-items:center}
  .wm .lbl{background:rgba(11,22,32,.85);border:1px solid var(--line);border-radius:7px;padding:2px 6px;text-align:center;white-space:nowrap;line-height:1.2}
  .wm .lbl b{font-size:11px;display:block}
  .wm .lbl span{font-family:'JetBrains Mono',monospace;font-size:11px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:rgba(11,22,32,.82);border:1.5px solid var(--c);border-radius:20px;padding:2px 7px 2px 3px;font-size:10px;white-space:nowrap;color:var(--ink);transform:translate(-50%,-50%);cursor:pointer}
  .chip svg{flex:none}
  .chip i{font-style:normal;font-family:'JetBrains Mono',monospace;color:var(--c)}
  .ovl{background:rgba(11,22,32,.85);border:1px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--ink);font-size:11px}
  .ovl .t{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
  .legend span{display:inline-flex;align-items:center;gap:3px;margin-right:6px;white-space:nowrap}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Windshift</h1>
    <div class="sub" id="updated"></div>
    <div class="seg" id="units"><button data-u="kn">kn</button><button data-u="kmh">km/h</button><button data-u="ms">m/s</button></div>
    <div class="seg" id="lang"><button data-l="de">DE</button><button data-l="en">EN</button></div>
    <button class="btn" id="animToggle"></button>
    <button class="btn" id="reload" aria-label="Refresh">↻</button>
  </header>
  <main>
    <div class="mapwrap"><div id="map"></div></div>
    <aside>
      <div class="card"><div class="summary" id="summary"></div></div>
      <div class="card"><h2><span data-i18n="stations"></span><span class="r" data-i18n="last3h"></span></h2><div id="list"></div></div>
      <div class="card">
        <h2 data-i18n="systems"></h2>
        <div class="row">
          <div class="seg" id="mode"><button data-m="live"></button><button data-m="sim"></button></div>
          <select id="preset" class="btn" aria-label="Scenario" style="flex:1"></select>
        </div>
        <div class="note" id="modeNote"></div>
        <div id="sliders"></div>
      </div>
      <div class="card">
        <h2 data-i18n="boat"></h2>
        <div class="row">
          <button class="btn" id="boatBtn"></button>
          <select id="twa" class="btn" aria-label="Angle to the wind"></select>
          <select id="tack" class="btn" aria-label="Tack"></select>
          <button class="btn" id="boatClear"></button>
        </div>
        <div class="note" id="boatInfo"></div>
      </div>
      <details class="about"><summary data-i18n="about"></summary><div id="aboutText"></div></details>
    </aside>
  </main>
</div>

<script>
// =================== i18n ===================
const I18N = {
 en:{
  sub:'live wind, eastern Lake Constance', loading:'Loading observations …', updated:t=>`Updated ${t} · 10-min values`,
  animOn:'Flow: on', animOff:'Flow: off', stations:'Stations', last3h:'last 3 h', systems:'Wind systems', boat:'Boat test',
  avg:'Average', dir:'Direction', gust:'Gust', gustS:'gust', stale:'stale', building:'building history …', nodata:'No data', noobs:'No observations available.',
  warn34:'Gusts ≥ 34 kn (storm level)', warn25:'Gusts ≥ 25 kn (strong wind)', warn0:'Below strong-wind level',
  live:'Live (fitted)', sim:'Simulator', load:'Load scenario …',
  noteSim:'Simulator: the flow shows only the systems you set. Station markers still show live data.',
  noteLive:'Live: direction and strength of every system are fitted to the four stations (bars show the fit). Move a slider to take over.',
  noteWait:'Live: waiting for station data …', from:'from', upto:'up to',
  boatBtn:'⛵ Drop boat', clear:'Clear', stbd:'starboard tack', port:'port tack',
  twa:{45:'45° close-hauled',60:'60° close reach',90:'90° beam reach',120:'120° broad reach',160:'160° running'},
  placing:'Tap on the lake to put the boat in the water.', notWater:'That is not water – try again.',
  boatInfo:(twa,tack,turn,tt,full,stop)=>`Sails untouched (${twa}° to the wind, ${tack}) · heading turned <b>${turn}°</b> · ${tt} sailed${full?' · <b class="ok">full circle!</b>':''}${stop?' · stopped: '+stop:''}`,
  shore:'reached the shore', nowind:'no wind data',
  legendArrow:'Arrows point where the wind blows to', synTitle:'Large-scale', calm:'calm',
  about:'About, model & sources',
  aboutText:`<p>Observations: <a href="https://data.hub.geosphere.at/dataset/tawes-v1-10min">GeoSphere Austria</a> (CC BY 4.0, raw data), <a href="https://opendatadocs.meteoswiss.ch/a-data-groundbased/a1-automatic-weather-stations">Source: MeteoSwiss</a>, <a href="https://brightsky.dev">DWD via Bright Sky</a>. 10-min means; gust = peak within the interval. Refreshes every 5 minutes. Map: Esri, © OpenStreetMap contributors.</p>
  <p>The animated flow is a model, not a measurement: a large-scale wind with adjustable direction that the terrain reshapes, plus six local systems with assumed shapes. In live mode their strengths are fitted to the four stations (bounded least squares) and remaining differences are blended in near each station; motion is sped up. Assumptions draw on Gohm et al. (2015, Pfänderwind), MeteoSwiss/SRF (Rhine Valley föhn), DWD (land–lake breeze) and a ZAMG report of a convergence over the eastern lake.</p>
  <p>Prototype – not an official storm warning. Always follow the storm warning lights.</p>`,
  dirs:['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'], locale:'en-GB',
  sys:{
   syn:['Large-scale wind','One synoptic flow from any direction, reshaped by the terrain: steered along the lake axis (WNW–ESE), braked and split at the Pfänder/Alps wall (south part into the Rhine Valley, north part towards Lindau), blocked by the Appenzell/Alps edge except at the Rhine Valley gap.'],
   rheintal:['Rhine Valley','Positive: south föhn / night-time mountain wind accelerated in the St. Gallen Rhine Valley, leaving it over the delta from SSE and fanning out towards Altenrhein–Rorschach. Negative: daytime valley breeze sucking lake air into the valley.'],
   rhein:['Rhine outflow','Cold air draining along the river bed and dams (night/morning) forms a narrow jet out of the new Rhine mouth between Fußach and Rohrspitz.'],
   wald:['Bregenzerwald','Drainage and gap wind out of the Bregenzer Ach valley plus the south-east Pfänderwind over the Gebhardsberg (evening to morning); reaches the lake from SE between Bregenz and Hard.'],
   pfaender:['Pfänder downslope','Classical Pfänderwind: E/NE flow crosses the Pfänder ridge and falls foehn-like onto Lochau and Bregenz. Strong near the shore, gone a few km out.'],
   swiss:['Appenzell hills','Downslope wind and "Appenzeller föhn" from the hills above Rorschach and Altenrhein, from S to SSW, decaying offshore.'],
   thermal:['Land ⇄ lake breeze','Positive: at night the shores cool faster than the lake, cold air drains offshore from every side and converges over open water. Negative: on sunny afternoons wind blows from the lake towards every shore.'],
  },
  ends:{rheintal:['← valley breeze','föhn →'], thermal:['← lake breeze','land breeze →']},
  hints:{ne:'E–NE flow: classical Pfänderwind likely.', n:'Northerly / Bise: steady, bends into the Rhine Valley at the south shore.', s:'Southerly flow over the Alps: watch for föhn in the Rhine Valley.', sw:'SW–W flow: with cold air in the valley a weak SE Pfänderwind is possible (evening–morning).', nw:'NW flow: little terrain interaction, channelled along the lake.'},
  presets:{night:'Calm night – land-breeze convergence', foehn:'Föhn storm out of the Rhine Valley', west:'Westerly front', bise:'Bise with Pfänderwind', pfaender:'Spring evening Pfänderwind', sepf:'SE Pfänderwind under a westerly (night)', summer:'Sunny summer afternoon', calm:'All off'},
 },
 de:{
  sub:'Live-Wind, östlicher Bodensee', loading:'Lade Messwerte …', updated:t=>`Stand ${t} · 10-Min-Werte`,
  animOn:'Strömung: an', animOff:'Strömung: aus', stations:'Stationen', last3h:'letzte 3 h', systems:'Windsysteme', boat:'Boots-Test',
  avg:'Mittel', dir:'Richtung', gust:'Böe', gustS:'Böe', stale:'veraltet', building:'Verlauf wird aufgebaut …', nodata:'Keine Daten', noobs:'Keine Messwerte verfügbar.',
  warn34:'Böen ≥ 34 kn (Sturm)', warn25:'Böen ≥ 25 kn (Starkwind)', warn0:'Unter Starkwindniveau',
  live:'Live (angepasst)', sim:'Simulator', load:'Szenario laden …',
  noteSim:'Simulator: Die Strömung zeigt nur die eingestellten Systeme. Die Stationen zeigen weiter Live-Daten.',
  noteLive:'Live: Richtung und Stärke aller Systeme werden an die vier Stationen angepasst (Balken zeigen den Fit). Einen Regler bewegen, um selbst zu übernehmen.',
  noteWait:'Live: warte auf Stationsdaten …', from:'aus', upto:'bis',
  boatBtn:'⛵ Boot setzen', clear:'Löschen', stbd:'Steuerbordbug', port:'Backbordbug',
  twa:{45:'45° hoch am Wind',60:'60° am Wind',90:'90° halber Wind',120:'120° raumschots',160:'160° vor dem Wind'},
  placing:'Tippe auf den See, um das Boot ins Wasser zu setzen.', notWater:'Das ist kein Wasser – nochmal versuchen.',
  boatInfo:(twa,tack,turn,tt,full,stop)=>`Segel unverändert (${twa}° zum Wind, ${tack}) · Kurs gedreht um <b>${turn}°</b> · ${tt} gesegelt${full?' · <b class="ok">einmal im Kreis!</b>':''}${stop?' · gestoppt: '+stop:''}`,
  shore:'Ufer erreicht', nowind:'keine Winddaten',
  legendArrow:'Pfeile zeigen, wohin der Wind weht', synTitle:'Großwetterlage', calm:'still',
  about:'Info, Modell & Quellen',
  aboutText:`<p>Messwerte: <a href="https://data.hub.geosphere.at/dataset/tawes-v1-10min">GeoSphere Austria</a> (CC BY 4.0, Rohdaten), <a href="https://opendatadocs.meteoswiss.ch/a-data-groundbased/a1-automatic-weather-stations">Quelle: MeteoSchweiz</a>, <a href="https://brightsky.dev">DWD über Bright Sky</a>. 10-Minuten-Mittel; Böe = Spitze im Intervall. Aktualisierung alle 5 Minuten. Karte: Esri, © OpenStreetMap-Mitwirkende.</p>
  <p>Die animierte Strömung ist ein Modell, keine Messung: eine Großwetterlage mit einstellbarer Richtung, die vom Gelände verformt wird, plus sechs lokale Systeme mit angenommener Form. Im Live-Modus werden ihre Stärken an die vier Stationen angepasst (beschränkte Ausgleichsrechnung), Restabweichungen werden nahe jeder Station eingerechnet; die Bewegung läuft im Zeitraffer. Grundlagen: Gohm et al. (2015, Pfänderwind), MeteoSchweiz/SRF (Rheintal-Föhn), DWD (Land-See-Wind) und ein ZAMG-Bericht über eine Konvergenz über dem Ostsee.</p>
  <p>Prototyp – keine offizielle Sturmwarnung. Maßgeblich sind die Sturmwarnleuchten.</p>`,
  dirs:['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'], locale:'de-AT',
  sys:{
   syn:['Großwetterlage','Eine großräumige Strömung aus beliebiger Richtung, vom Gelände verformt: entlang der Seeachse (WNW–OSO) geführt, an der Pfänder/Alpen-Wand gebremst und geteilt (Süden ins Rheintal, Norden Richtung Lindau), am Appenzell/Alpen-Rand blockiert – außer an der Rheintal-Öffnung.'],
   rheintal:['Rheintal','Positiv: Südföhn / nächtlicher Bergwind, im St. Galler Rheintal beschleunigt, tritt aus SSO über das Delta aus und fächert Richtung Altenrhein–Rorschach auf. Negativ: Talwind am Tag, der Seeluft ins Tal saugt.'],
   rhein:['Rhein-Ausfluss','Kaltluft, die nachts und morgens entlang Flussbett und Dämmen abfließt, bildet einen schmalen Strahl aus der Rheinmündung zwischen Fußach und Rohrspitz.'],
   wald:['Bregenzerwald','Abfluss- und Lückenwind aus dem Tal der Bregenzer Ach plus Südost-Pfänderwind über den Gebhardsberg (abends bis morgens); erreicht den See aus SO zwischen Bregenz und Hard.'],
   pfaender:['Pfänder-Fallwind','Klassischer Pfänderwind: Ost-/Nordostströmung überquert den Pfänder und fällt föhnartig auf Lochau und Bregenz. Stark nahe am Ufer, wenige km draußen verschwunden.'],
   swiss:['Appenzeller Hänge','Hangabwind und „Appenzeller Föhn“ von den Hängen über Rorschach und Altenrhein, aus S bis SSW, nimmt seewärts ab.'],
   thermal:['Land- ⇄ Seewind','Positiv: Nachts kühlen die Ufer schneller ab als der See, Kaltluft fließt von allen Seiten aufs Wasser und läuft dort zusammen. Negativ: An sonnigen Nachmittagen weht der Wind vom See zu allen Ufern.'],
  },
  ends:{rheintal:['← Talwind','Föhn →'], thermal:['← Seewind','Landwind →']},
  hints:{ne:'Ost-/Nordostströmung: klassischer Pfänderwind wahrscheinlich.', n:'Nordlage / Bise: gleichmäßig, biegt am Südufer ins Rheintal ein.', s:'Südströmung über den Alpen: auf Föhn im Rheintal achten.', sw:'SW–W-Strömung: bei Kaltluft im Tal ist schwacher SO-Pfänderwind möglich (abends–morgens).', nw:'NW-Strömung: wenig Geländeeinfluss, entlang des Sees geführt.'},
  presets:{night:'Ruhige Nacht – Landwind-Konvergenz', foehn:'Föhnsturm aus dem Rheintal', west:'Westwind-Front', bise:'Bise mit Pfänderwind', pfaender:'Pfänderwind am Frühlingsabend', sepf:'SO-Pfänderwind unter Westlage (Nacht)', summer:'Sonniger Sommernachmittag', calm:'Alles aus'},
 }
};
let LANG = (()=>{ try{ const s=localStorage.getItem('wind-lang'); if(s) return s; }catch(e){}
  return ((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().startsWith('de') ? 'de' : 'en'; })();
const T = () => I18N[LANG];

// =================== basics ===================
const STATIONS = [
  {id:'lindau',    name:'Lindau',     src:'DWD · Lindau (SWN)',      lat:47.540, lon:9.684},
  {id:'bregenz',   name:'Bregenz',    src:'GeoSphere · TAWES 11101', lat:47.499, lon:9.746, gs:'11101'},
  {id:'rohrspitz', name:'Rohrspitz',  src:'GeoSphere · TAWES 11299', lat:47.497, lon:9.630, gs:'11299'},
  {id:'altenrhein',name:'Altenrhein', src:'MeteoSwiss · ARH',        lat:47.485, lon:9.566},
];
let UNIT = (()=>{try{return localStorage.getItem('wind-unit')||'kn'}catch(e){return 'kn'}})();
const CONV = {kn:1.94384, kmh:3.6, ms:1}, ULABEL = {kn:'kn', kmh:'km/h', ms:'m/s'};
const fmt = ms => ms==null||isNaN(ms) ? '–' : (ms*CONV[UNIT]).toFixed(UNIT==='ms'?1:0);
const BFT = [0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
const bft = ms => { let b=0; while(b<BFT.length && ms>=BFT[b]) b++; return b; };
const color = ms => ms==null ? '#566' : ms<3.4 ? 'var(--b0)' : ms<5.5 ? 'var(--b1)' : ms<8 ? 'var(--b2)' : ms<12.9 ? 'var(--b3)' : 'var(--b4)';
const dirName = d => d==null ? '–' : T().dirs[Math.round(((d%360)+360)%360/22.5)%16];
const hhmm = t => t ? t.toLocaleTimeString(T().locale,{hour:'2-digit',minute:'2-digit'}) : '–';
const SYSCOL = {syn:'#9fb4ff', rheintal:'#ef8a5b', rhein:'#5bc0ef', wald:'#7bd88f', pfaender:'#f2c94c', swiss:'#d38cf2', thermal:'#f27fa5'};

// =================== data ===================
async function loadGeoSphere(){
  const end = new Date(), start = new Date(end - 3*3600e3), iso = d => d.toISOString().slice(0,16);
  const ids = STATIONS.filter(s=>s.gs).map(s=>s.gs).join(',');
  const j = await fetch(`https://dataset.api.hub.geosphere.at/v1/station/historical/tawes-v1-10min?parameters=DD,FF,FFX&station_ids=${ids}&start=${iso(start)}&end=${iso(end)}`)
    .then(r=>{ if(!r.ok) throw new Error('GeoSphere '+r.status); return r.json(); });
  const ts = j.timestamps.map(t=>new Date(t)), out = {};
  for(const f of j.features){ const p = f.properties.parameters;
    out[f.properties.station] = ts.map((t,i)=>({t, dd:p.DD.data[i], ff:p.FF.data[i], fx:p.FFX.data[i]})).filter(r=>r.ff!=null); }
  return out;
}

// =================== model ===================
// ---------- Local wind-system model (strong assumptions, see SYSTEMS[].why) ----------
// Local km grid centred on the eastern lake: x east, y north.
const ORIGIN = {lon:9.65, lat:47.53};
const DEG = Math.PI/180;
const toXY = (lat,lon) => [(lon-ORIGIN.lon)*75.1, (lat-ORIGIN.lat)*111.2];
const vecTo = (toDeg, s) => [Math.sin(toDeg*DEG)*s, Math.cos(toDeg*DEG)*s];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
// A jet leaving a valley/gap: origin (ox,oy), blowing FROM fromDeg, widening and fanning out downstream.
function jet(x,y, ox,oy, fromDeg, width, reach, spread){
  const to = fromDeg+180, ax = Math.sin(to*DEG), ay = Math.cos(to*DEG);
  const dx = x-ox, dy = y-oy, s = dx*ax + dy*ay, c = dx*ay - dy*ax;
  const along = s < 0 ? Math.exp(-(s*s)/1.2) : Math.exp(-s/reach);
  const w = width*(1 + Math.max(0,s)/reach);
  const k = along*Math.exp(-(c*c)/(2*w*w));
  return vecTo(to + spread*Math.tanh(c/(2*w)), k);
}
// Downslope wind falling off a ridge line p1->p2, decaying with distance on the downwind side.
function slope(x,y, p1, p2, fromDeg, decay){
  const to = fromDeg+180, tx = Math.sin(to*DEG), ty = Math.cos(to*DEG);
  const ex = p2[0]-p1[0], ey = p2[1]-p1[1], L2 = ex*ex+ey*ey;
  const tr = ((x-p1[0])*ex + (y-p1[1])*ey)/L2, t = clamp(tr, 0, 1);
  const cx = p1[0]+t*ex, cy = p1[1]+t*ey;
  // signed distance downwind of the ridge line (measured along the wind direction)
  const down = (x-cx)*tx + (y-cy)*ty;
  const over = Math.max(0, Math.abs(tr-0.5)-0.5)*Math.sqrt(L2);   // km beyond the ridge ends
  const endFade = Math.exp(-(over*over)/2.5);
  const k = (down <= 0 ? 1 : Math.exp(-down/decay)) * endFade;
  return vecTo(to, k);
}
// Large-scale flow from any direction, deformed by the terrain around the eastern lake.
function synoptic(x,y,dirFrom){
  let [u,v] = vecTo(dirFrom+180, 1);
  const ax=Math.sin(115*DEG), ay=Math.cos(115*DEG), al=u*ax+v*ay, pu=al*ax, pv=al*ay;
  u = pu + 0.6*(u-pu); v = pv + 0.6*(v-pv);                         // channelling along the lake axis
  if(u>0){ const lost = u*0.65/(1+Math.exp(-(x-4.5)/1.5)); u -= lost;  // eastern wall: brake and split
           v -= lost*0.9*Math.tanh(-(y+0.5)/2); }
  if(v<0){ const wall = 0.6/(1+Math.exp((y+3)/1.2)) * (1-Math.exp(-((x+1)**2)/9));
           const lost = -v*wall; v += lost; u += lost*0.8*Math.tanh((x+1)/3); }   // southern edge, open at the Rhine gap
  return [u,v];
}
// Hints: which local systems a given large-scale direction tends to switch on.
function synHint(dir){
  const d=((dir%360)+360)%360;
  if(d>=30 && d<=100) return 'E–NE flow: classical Pfänderwind likely (flow crossing the Pfänder ridge and falling onto Bregenz).';
  if(d>=330 || d<30) return 'Northerly / Bise: steady and dry, bends into the Rhine Valley at the south shore.';
  if(d>=150 && d<=215) return 'Southerly flow over the Alps: watch for föhn breaking through in the Rhine Valley.';
  if(d>215 && d<=290) return 'SW–W flow: with cold air in the Rhine Valley a weak SE Pfänderwind over the Gebhardsberg is possible (evening–morning).';
  return 'Flow from the NW: little terrain interaction, mostly channelled along the lake.';
}
const SYSTEMS = [
  { id:'syn', name:'Large-scale wind (direction adjustable)', min:0, max:1, vmax:15, gust:1.35, dir:true,
    why:'One synoptic flow from any direction, reshaped by the terrain: cross-lake components are weakened and the flow is steered along the lake axis (WNW–ESE); eastward flow is braked and split by the Pfänder/Alps wall (south part into the Rhine Valley, north part towards Lindau); southward flow is blocked by the Appenzell/Alps edge except at the Rhine Valley gap, where it continues into the valley.',
    f:(x,y,dir)=> synoptic(x,y,dir) },
  { id:'rheintal', name:'Rhine Valley: föhn ⇄ valley breeze', min:-1, max:1, vmax:16, gust:1.65,
    why:'Positive: south föhn / night-time mountain wind accelerated in the St. Gallen Rhine Valley, leaving the valley over the delta from SSE and fanning out towards Altenrhein–Rorschach. Negative: daytime valley breeze sucking lake air into the valley (converging flow).',
    f:(x,y)=> jet(x,y, -2.5,-7.5, 160, 3.2, 6.5, 18) },
  { id:'rhein', name:'Rhine river outflow', min:0, max:1, vmax:7, gust:1.2,
    why:'Cold air draining along the river bed and the Rhine dams (mostly at night and in the morning) forms a narrow jet that pushes out of the new Rhine mouth between Fußach and Rohrspitz.',
    f:(x,y)=> jet(x,y, -0.6,-3.2, 160, 0.9, 3.0, 20) },
  { id:'wald', name:'Bregenzerwald / Bregenzer Ach (SE)', min:0, max:1, vmax:9, gust:1.35,
    why:'Drainage and gap wind out of the Bregenzer Ach valley, plus the south-east Pfänderwind that crosses the Gebhardsberg (evening to early morning). Reaches the lake from SE between Bregenz and Hard.',
    f:(x,y)=> jet(x,y, 5.2,-3.8, 140, 1.6, 3.5, 20) },
  { id:'pfaender', name:'Pfänder downslope wind (E/NE)', min:0, max:1, vmax:13, gust:1.5,
    why:'Classical Pfänderwind: easterly/north-easterly flow crosses the Pfänder ridge and falls foehn-like onto Lochau and Bregenz. Strong close to the shore, gone a few km out.',
    f:(x,y)=> slope(x,y, [8.2,-3.0], [7.0,2.5], 70, 3.5) },
  { id:'thermal', name:'Thermal: land breeze ⇄ lake breeze', min:-1, max:1, vmax:5, gust:1.15,
    why:'Positive: at night and in the morning the shores cool faster than the lake, cold air drains offshore from every side and converges over the open water. Negative: on sunny afternoons the land heats up and the wind blows from the lake towards every shore (diverging).',
    f:(x,y)=>{ const cx=-3, cy=0.5, dx=cx-x, dy=cy-y, r=Math.hypot(dx,dy)||1e-6; const k=Math.tanh(r/3)*Math.exp(-Math.max(0,r-9)/4);
               return [dx/r*k, dy/r*k]; } },
  { id:'swiss', name:'Swiss hills (Appenzell, S/SSW)', min:0, max:1, vmax:9, gust:1.4,
    why:'Downslope wind and "Appenzeller föhn" from the hills above Rorschach and Altenrhein, hitting the Swiss shore from S to SSW and decaying offshore.',
    f:(x,y)=> slope(x,y, [-15,-6.6], [-5.5,-5.4], 195, 3.5) },
];
// Wind from a set of strengths at local km coordinates
function modelUV(x,y, S){
  let u=0, v=0, gw=0, g=0;
  for(const sys of SYSTEMS){ const s = S[sys.id]||0; if(!s) continue;
    const [a,b] = sys.f(x,y,S.synDir??270); const k = s*sys.vmax; u += a*k; v += b*k;
    const m = Math.hypot(a*k,b*k); gw += m; g += m*sys.gust; }
  return {u, v, gf: gw ? g/gw : 1.3};
}
// Fit strengths to station observations: bounded, ridge-regularised least squares (projected gradient)
function fitSystems(obs){ // obs: [{x,y,u,v}] – grid search over the large-scale direction, linear bounded LSQ for the strengths
  let best=null;
  for(let dir=0; dir<360; dir+=10){
    const B = obs.map(o => SYSTEMS.map(sys => { const [a,b] = sys.f(o.x,o.y,dir); return [a*sys.vmax, b*sys.vmax]; }));
    const lam = 6; let L = lam; B.forEach(r=>r.forEach(([a,b])=>L+=a*a+b*b));
    const s = SYSTEMS.map(()=>0);
    for(let it=0; it<400; it++){
      const g = s.map(sk=>lam*sk);
      obs.forEach((o,i)=>{ let pu=0,pv=0; s.forEach((sk,k)=>{pu+=sk*B[i][k][0]; pv+=sk*B[i][k][1];});
        const ru=pu-o.u, rv=pv-o.v; s.forEach((_,k)=>{ g[k]+= ru*B[i][k][0] + rv*B[i][k][1]; }); });
      s.forEach((sk,k)=>{ s[k] = clamp(sk - g[k]/L, SYSTEMS[k].min, SYSTEMS[k].max); });
    }
    let cost = lam*s.reduce((a,b)=>a+b*b,0);
    obs.forEach((o,i)=>{ let pu=0,pv=0; s.forEach((sk,k)=>{pu+=sk*B[i][k][0]; pv+=sk*B[i][k][1];}); cost+=(pu-o.u)**2+(pv-o.v)**2; });
    if(!best || cost<best.cost) best={cost, dir, s:[...s]};
  }
  const S = {synDir:best.dir}; SYSTEMS.forEach((sys,k)=>S[sys.id]=+best.s[k].toFixed(3));
  const resid = obs.map(o=>{ const m = modelUV(o.x,o.y,S); return {x:o.x, y:o.y, u:o.u-m.u, v:o.v-m.v}; });
  return {S, resid};
}

const PRESETS = {
  night:  {thermal:0.7, pfaender:0.2, wald:0.25, rhein:0.3, synDir:270},
  foehn:  {rheintal:0.9, rhein:0.2, wald:0.3, swiss:0.45, syn:0.15, synDir:200},
  west:   {syn:0.75, synDir:260, rheintal:-0.1},
  bise:   {syn:0.5, synDir:50, pfaender:0.5},
  pfaender:{pfaender:0.8, syn:0.2, synDir:70},
  sepf:   {wald:0.6, syn:0.15, synDir:250, rheintal:0.1},
  summer: {thermal:-0.7, rheintal:-0.45, syn:0.1, synDir:250},
  calm:   {synDir:270},

let MODE='live', SIM={...PRESETS.night}, FIT=null, PRESET='';
function refit(){
  const obs=[], ratios=[];
  for(const st of STATIONS){ const r=(DATA[st.id]||[]).slice(-1)[0]; if(!r||r.dd==null||r.ff==null) continue;
    const [x,y]=toXY(st.lat,st.lon), [u,v]=vecTo(r.dd+180, r.ff); obs.push({x,y,u,v});
    if(r.fx!=null && r.ff>0.5) ratios.push(r.fx/r.ff); }
  if(!obs.length){ FIT=null; return; }
  ratios.sort((a,b)=>a-b);
  FIT = {...fitSystems(obs), gr: clamp(ratios.length?ratios[Math.floor(ratios.length/2)]:1.4, 1.1, 2.5)};
}
const curS = () => MODE==='sim' ? SIM : (FIT ? FIT.S : {});
function currentField(lat, lon){
  const [x,y]=toXY(lat,lon);
  if(MODE==='sim'){ const m=modelUV(x,y,SIM), sp=Math.hypot(m.u,m.v); return {u:m.u, v:m.v, mean:sp, gust:sp*m.gf}; }
  if(!FIT) return null;
  const m=modelUV(x,y,FIT.S); let u=m.u, v=m.v;
  for(const r of FIT.resid){ const w=Math.exp(-((x-r.x)**2+(y-r.y)**2)/18); u+=w*r.u; v+=w*r.v; }
  const sp=Math.hypot(u,v); return {u, v, mean:sp, gust:sp*FIT.gr};
}
function windField(lat, lon){
  const f=currentField(lat,lon); if(!f) return null;
  const m=Math.hypot(f.u,f.v)||1e-6; return {ux:f.u/m, uy:f.v/m, mean:f.mean, gust:Math.max(f.gust,f.mean)};
}

function windSetup(){
  if(!MAP || W.cv) return;
  W.cv=document.createElement('canvas');
  W.cv.style.cssText='position:absolute;inset:0;z-index:450;pointer-events:none;transition:opacity .25s';
  MAP.getContainer().appendChild(W.cv); W.ctx=W.cv.getContext('2d');
  MAP.on('movestart zoomstart', ()=>{ W.moving=true; W.cv.style.opacity=0; });
  MAP.on('moveend zoomend resize', ()=>{ W.moving=false; windRebuild(); W.cv.style.opacity=1; });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) windStart(); });
  windRebuild();

function windRebuild(){
  if(!W.cv) return;
  const size=MAP.getSize(); W.dpr=Math.min(window.devicePixelRatio||1, 2);
  W.cv.width=size.x*W.dpr; W.cv.height=size.y*W.dpr; W.cv.style.width=size.x+'px'; W.cv.style.height=size.y+'px';
  const p=new Path2D();
  LAKE.forEach(([lo,la],i)=>{ const q=MAP.latLngToContainerPoint([la,lo]); i?p.lineTo(q.x*W.dpr,q.y*W.dpr):p.moveTo(q.x*W.dpr,q.y*W.dpr); });
  p.closePath(); W.path=p;
  let inside=0; const probe=400;
  for(let k=0;k<probe;k++) if(W.ctx.isPointInPath(W.path, Math.random()*W.cv.width, Math.random()*W.cv.height)) inside++;
  const n=Math.max(150, Math.min(2600, Math.round((inside/probe)*size.x*size.y/70)));
  W.parts=[]; for(let k=0;k<n;k++) W.parts.push(spawn({}, true));
  W.ctx.clearRect(0,0,W.cv.width,W.cv.height);
  windRegrid();

function windRegrid(){
  if(!W.cv) return;
  const st=W.step*W.dpr; W.gw=Math.ceil(W.cv.width/st)+1; W.gh=Math.ceil(W.cv.height/st)+1;
  W.grid=new Array(W.gw*W.gh); let any=false;
  for(let j=0;j<W.gh;j++) for(let i=0;i<W.gw;i++){
    const ll=MAP.containerPointToLatLng([i*st/W.dpr, j*st/W.dpr]); const f=windField(ll.lat, ll.lng); W.grid[j*W.gw+i]=f; if(f) any=true; }

function spawn(p, randomAge){

// =================== boat ===================
const BOAT = {placing:false, run:false, lat:0, lon:0, path:[], line:null, mk:null, turned:0, prevH:null, sec:0, n:0, full:false, raf:null};
function lakeContains(lat, lon){ let inside=false;
  for(let i=0,j=LAKE.length-1;i<LAKE.length;j=i++){ const [xi,yi]=LAKE[i], [xj,yj]=LAKE[j];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
const boatSvg = h => `<svg width="30" height="30" viewBox="-15 -15 30 30" style="transform:rotate(${h}deg)"><path d="M0 -12 L6 8 L0 5 L-6 8Z" fill="#fff" stroke="#08131a" stroke-width="1.6"/></svg>`;
const boatInfo = txt => { document.getElementById('boatInfo').innerHTML = txt; };
function boatClear(){ BOAT.run=false; if(BOAT.raf) cancelAnimationFrame(BOAT.raf); BOAT.raf=null;
  if(BOAT.line) MAP.removeLayer(BOAT.line); if(BOAT.mk) MAP.removeLayer(BOAT.mk); BOAT.line=BOAT.mk=null; boatInfo(''); }
function boatStart(lat, lon){
  boatClear(); Object.assign(BOAT, {run:true, lat, lon, path:[[lat,lon]], turned:0, prevH:null, sec:0, n:0, full:false});
  BOAT.line = L.polyline(BOAT.path, {color:'#fff', weight:2.5, opacity:0.9, dashArray:'1 6', lineCap:'round', interactive:false}).addTo(MAP);
  BOAT.mk = L.marker([lat,lon], {icon:L.divIcon({className:'', html:boatSvg(0), iconSize:[30,30], iconAnchor:[15,15]}), interactive:false, zIndexOffset:1000}).addTo(MAP);
  BOAT.raf = requestAnimationFrame(boatFrame);
}
function boatFrame(){
  BOAT.raf=null; if(!BOAT.run) return;
  const twa=+document.getElementById('twa').value, tack=document.getElementById('tack').value==='stbd'?1:-1, dt=5;
  let h=BOAT.prevH||0, stop='';
  for(let k=0;k<5;k++){
    const f=currentField(BOAT.lat, BOAT.lon); if(!f){ stop=T().nowind; break; }
    const ws=Math.hypot(f.u,f.v), from=(Math.atan2(-f.u,-f.v)/DEG+360)%360;
    h = tack>0 ? from-twa : from+twa;                           // starboard tack: wind over the right side
    if(BOAT.prevH!=null) BOAT.turned += ((h-BOAT.prevH+540)%360)-180; BOAT.prevH=h;
    const d=clamp(0.45*ws, 0.3, 4.5)*dt;                         // simple polar: ~45 % of wind speed
    BOAT.lat += d*Math.cos(h*DEG)/111200; BOAT.lon += d*Math.sin(h*DEG)/(111200*Math.cos(BOAT.lat*DEG)); BOAT.sec += dt;
    if(!lakeContains(BOAT.lat, BOAT.lon)){ stop=T().shore; break; }
  }
  BOAT.path.push([BOAT.lat,BOAT.lon]); BOAT.n++;
  if(BOAT.n%2===0) BOAT.line.setLatLngs(BOAT.path);
  BOAT.mk.setLatLng([BOAT.lat,BOAT.lon]); const el=BOAT.mk.getElement(); if(el && el.firstChild) el.firstChild.style.transform=`rotate(${h}deg)`;
  const turned=Math.abs(BOAT.turned); if(turned>=360) BOAT.full=true;
  const tt=`${Math.floor(BOAT.sec/3600)} h ${String(Math.floor(BOAT.sec/60)%60).padStart(2,'0')} min`;
  boatInfo(T().boatInfo(twa, tack>0?T().stbd:T().port, Math.round(turned), tt, BOAT.full, stop));
  if(stop || turned>=720 || BOAT.n>6000){ BOAT.run=false; BOAT.line.setLatLngs(BOAT.path); return; }
  BOAT.raf=requestAnimationFrame(boatFrame);
}
function boatClick(e){
  if(!BOAT.placing) return; BOAT.placing=false; MAP.getContainer().style.cursor='';
  if(!lakeContains(e.latlng.lat, e.latlng.lng)){ boatInfo(T().notWater); return; }
  boatStart(e.latlng.lat, e.latlng.lng);
}
