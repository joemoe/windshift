name: Instagram scheduled posts
on:
  # triggered by Supabase pg_cron → functions/v1/gh-dispatch (Vienna time, DST-proof)
  workflow_dispatch:
permissions: { contents: read, id-token: write }
concurrency: instagram
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ig-scheduled.mjs
